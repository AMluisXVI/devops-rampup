# Runs on the back-end host: it is the only one the RDS security group lets in.
# The password is read on the host from the API's root-only env file (written by node_app).
# Passing it through Ansible's `environment:` would put it on the sudo command line, and
# sudo logs every command to the system journal.
- name: Install the MySQL client
  ansible.builtin.dnf:
    name: mariadb1011
    state: present

- name: Check that the database accepts the password stored in SSM
  ansible.builtin.shell: >-
    . /etc/movie-analyst-api.env &&
    MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -u "$DB_USER" -e "SELECT 1" "$DB_NAME"
  register: db_login
  changed_when: false
  failed_when: false

- name: Stop with a clear message if the login failed
  ansible.builtin.fail:
    msg: >-
      Cannot log in to the database with the password in SSM ({{ db_password_param }}).
      mysql said: {{ db_login.stderr | trim }}.
      If it is "Access denied", RDS and SSM hold different passwords (an apply stopped half-way):
      bump db_password_version in terraform/database.tf, run terraform apply and run this again.
  when: db_login.rc != 0

- name: Create tables (idempotent, CREATE TABLE IF NOT EXISTS)
  ansible.builtin.shell: >-
    . /etc/movie-analyst-api.env &&
    MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -u "$DB_USER" "$DB_NAME" < /opt/movie-analyst-api/schema.sql
  changed_when: false

- name: Count existing movies
  ansible.builtin.shell: >-
    . /etc/movie-analyst-api.env &&
    MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -u "$DB_USER" -N -B -e "SELECT COUNT(*) FROM movies" "$DB_NAME"
  register: movie_count
  changed_when: false

# Run only on an empty table so the play stays idempotent (seeds.js itself tolerates duplicates).
- name: Load seed data
  ansible.builtin.shell:
    cmd: set -a && . /etc/movie-analyst-api.env && node seeds.js
    chdir: /opt/movie-analyst-api
  when: movie_count.stdout | int == 0
  changed_when: true # only runs when the table is empty, so it always inserts
