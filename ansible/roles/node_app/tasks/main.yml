- name: Create the service user (no login shell)
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Copy the application code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ app_name }}/"
    dest: "{{ app_dir }}/"
    owner: root
    group: root
    mode: u=rwX,go=rX
  notify: Restart app

- name: Install production dependencies
  ansible.builtin.command:
    cmd: npm install --omit=dev --no-audit --no-fund
    chdir: "{{ app_dir }}"
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'changed' in npm_install.stdout or 'removed' in npm_install.stdout"
  notify: Restart app

# npm start uses Windows syntax (SET NODE_ENV=dev), so systemd runs node directly.
- name: Write the environment file (secrets, root only)
  ansible.builtin.template:
    src: app.env.j2
    dest: "/etc/{{ app_name }}.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart app

- name: Install the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify: Restart app

- name: Enable and start the service
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true
